name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days without API traffic; pg_cron jobs
# inside the database do not count. One anonymous request to the Auth API every
# three days keeps the project active. The anon role has no table grants, so a
# REST read would return 401.

on:
  schedule:
    - cron: '23 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the Auth API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -o /dev/null -w "%{http_code}\n" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/health"
