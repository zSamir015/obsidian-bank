name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days without API traffic; pg_cron jobs
# inside the database do not count. One anonymous REST read every three days keeps
# the project active. RLS returns an empty list, which is enough.

on:
  schedule:
    - cron: "23 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/notifications?select=id&limit=1"
